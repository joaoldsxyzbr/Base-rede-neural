name: Neural Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Testes nativos do Neural Core
        run: npm test

      - name: Exemplo de inferencia
        run: node examples/linear.mjs

  python:
    name: Treinamento / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Testes de gradientes, aprendizado e exportacao
        run: python -m unittest discover -s training_tests -v

      - name: Exemplo reproduzivel XOR
        run: python -m examples.train_xor

  parity:
    name: Integração Python × JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Treinar e exportar referencias Python
        run: python -m training.parity_fixture > "$RUNNER_TEMP/neural-core-parity.json"

      - name: Comparar inferencias Python e JavaScript
        env:
          NEURAL_CORE_PARITY_FIXTURE: ${{ runner.temp }}/neural-core-parity.json
        run: node --test tests/parity.test.js

      - name: Gerar contrato e descritores de interoperabilidade com Python
        run: python -m training.interop_fixture > "$RUNNER_TEMP/neural-core-interop.json"

      - name: Conferir suporte e metadados Python x JavaScript
        env:
          NEURAL_CORE_INTEROP_FIXTURE: ${{ runner.temp }}/neural-core-interop.json
        run: node --test tests/interop.test.js

  browser:
    name: Navegador / Chrome headless
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Testar inferencia real no Chrome headless
        run: node scripts/browser-smoke.mjs

  benchmarks:
    name: Benchmark / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Medir carregamento, inferencia e memoria
        run: node benchmarks/inference.mjs

      - name: Comparar inferencia em lote e individual
        run: node benchmarks/batch.mjs

  extension-mv3:
    name: Extensão Manifest V3 / Chrome for Testing
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configurar Python para instalador oficial
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Baixar Chrome for Testing da Google
        run: python scripts/install-chrome-for-testing.py "$RUNNER_TEMP/neural-core-chrome" >> "$GITHUB_ENV"

      - name: Verificar extensão real no Chrome
        run: node scripts/extension-smoke.mjs

  scientific-evaluation:
    name: Qualidade científica / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Executar benchmarks com separacao treino e teste
        run: python -m evaluation.benchmark

      - name: Validar modelos com early stopping e teste independente
        run: python -m evaluation.quality

  cross-browser:
    name: Portabilidade / Firefox e WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar Playwright oficial da Microsoft apenas no CI
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Instalar Firefox e WebKit para teste
        run: npx playwright install --with-deps firefox webkit

      - name: Testar inferencia no Firefox, WebKit e WebKit emulado mobile
        run: node scripts/cross-browser-smoke.mjs

  workers-local:
    name: Portabilidade / Cloudflare workerd local
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar Wrangler oficial da Cloudflare apenas no CI
        run: npm install --no-save --no-package-lock wrangler@4.152.0

      - name: Testar Neural Core no workerd sem conta ou deploy
        run: node scripts/worker-smoke.mjs

  ci-lock-generator:
    name: Gerar lock temporario de ferramentas do CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Gerar lock reproduzivel de teste em ambiente efemero
        run: |
          npm install --prefix ci-tools --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('node:fs');const s=JSON.stringify(fs.readFileSync('ci-tools/package-lock.json','utf8'));console.log('NEURAL_LOCK_BEGIN');for(let i=0;i<s.length;i+=1000)console.log('NEURAL_LOCK_CHUNK:'+s.slice(i,i+1000));console.log('NEURAL_LOCK_END');"
