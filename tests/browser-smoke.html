<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Neural Core — browser smoke</title>
<output id="result">PENDING</output>
<script type="module">
  import { loadModel, predict, predictBatch, serializeModel } from '/src/index.js';
  const output = document.querySelector('#result');
  try {
    const response = await fetch('/tests/fixtures/parity.json');
    if (!response.ok) throw new Error(`Fixture HTTP ${response.status}`);
    const fixture = await response.json();
    if (fixture.fixtureVersion !== 1 || fixture.cases.length < 4) throw new Error('Fixture incompleta');
    let tested = 0;
    for (const entry of fixture.cases) {
      const model = loadModel(entry.model);
      const restored = loadModel(serializeModel(model));
      const batched = predictBatch(model, entry.samples.map(sample => sample.input));
      for (const [index, sample] of entry.samples.entries()) {
        const predicted = predict(model, sample.input);
        const second = predict(restored, sample.input);
        if (predicted.length !== sample.expected.length) throw new Error(`${entry.name}: dimensões`);
        for (let i = 0; i < predicted.length; i += 1) {
          const expected = sample.expected[i];
          const tolerance = 1e-5 + 1e-5 * Math.abs(expected);
          if (!Number.isFinite(predicted[i]) || Math.abs(predicted[i] - expected) > tolerance || predicted[i] !== second[i] || predicted[i] !== batched[index][i]) {
            throw new Error(`${entry.name}: divergência de saída ${i}`);
          }
        }
        tested += 1;
      }
    }
    // P13: ativação softmax, ReLU e rejeição de formato desconhecido por engine.
    const softmax = loadModel({ formatVersion: 1, layers: [{
      inputSize: 1, outputSize: 3, activation: 'softmax',
      weights: [1000, -1000, 999], biases: [0, 0, 0]
    }] });
    const probs = predict(softmax, [1]);
    const batched = predictBatch(softmax, [[1], [-1]]);
    if (probs[0] < 0.73 || probs[0] > 0.74 || probs[1] !== 0 ||
        probs[0] !== batched[0][0] ||
        Math.abs([...probs].reduce((a,b) => a + b, 0) - 1) > 1e-6)
      throw new Error('Softmax divergente');
    const relu = loadModel({formatVersion:1,layers:[{
      inputSize:1,outputSize:1,activation:'relu',weights:[-2],biases:[1]
    }]});
    if (predict(relu,[2])[0] !== 0 || predict(relu,[0])[0] !== 1)
      throw new Error('ReLU divergente');
    let rejected = false;
    try { loadModel({formatVersion:2,layers:[]}); } catch { rejected = true; }
    if (!rejected) throw new Error('Aceitou modelo v2 como v1');
    tested += 3;
    if (tested < 18) throw new Error('Cobertura insuficiente');
    output.textContent = `PASS: ${tested} previsões no navegador`;
    output.dataset.status = 'pass';
  } catch (error) {
    output.textContent = `FAIL: ${String(error.message || error)}`;
    output.dataset.status = 'fail';
  }
</script>
</html>
